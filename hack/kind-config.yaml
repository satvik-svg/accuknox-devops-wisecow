# kind cluster for trying the full setup locally.
# Reach the ingress with: kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 8443:443
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wisecow
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
