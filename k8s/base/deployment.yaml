apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  namespace: wisecow
  labels:
    app: wisecow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wisecow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: wisecow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wisecow
          # CI swaps this for the real registry image and commit tag (see kustomization.yaml)
          image: wisecow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4499
          # The server handles one connection at a time, so plain TCP probes keep
          # the checks cheap and do not eat into real requests.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # wisecow.sh creates a named pipe in its working directory
            - name: workdir
              mountPath: /app
            # scratch space for bash, since the root filesystem is read only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workdir
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
