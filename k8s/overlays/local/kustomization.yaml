apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local overlay: same app, self signed certificate, host wisecow.local
resources:
  - ../../base
  - selfsigned-issuer.yaml

patches:
  - target:
      kind: Ingress
      name: wisecow
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: selfsigned
      - op: replace
        path: /spec/tls/0/hosts/0
        value: wisecow.local
      - op: replace
        path: /spec/rules/0/host
        value: wisecow.local

images:
  - name: wisecow
    newName: wisecow
    newTag: local
